# Builds d1-native and d1-backend for Linux and Windows on every change to them, and keeps the Windows pair
# as a downloadable artifact.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [native/**, backend/**, records/import_names.tsv, .github/workflows/build.yml]
  pull_request:
    paths: [native/**, backend/**, records/import_names.tsv, .github/workflows/build.yml]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build libsdl2-dev
      - name: d1-native
        run: |
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
          build/native/tiling-fast-test
          ctest --test-dir build/native --output-on-failure
      - name: d1-backend
        run: cargo build --release --manifest-path backend/Cargo.toml

  windows:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20250114"
      SDL2_VERSION: "2.32.10"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (llvm-mingw, SDL2, Rust target)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          curl -sSfL -o /tmp/mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          sudo mkdir -p /opt/llvm-mingw && sudo tar -xJf /tmp/mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          curl -sSfL -o /tmp/sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          sudo tar -xzf /tmp/sdl.tar.gz -C /opt
          rustup target add x86_64-pc-windows-gnullvm
      - name: d1-native.exe
        run: |
          cmake -S native -B build/win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/native/cmake/windows-llvm-mingw.cmake -DLLVM_MINGW=/opt/llvm-mingw \
            -DCMAKE_PREFIX_PATH=/opt/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32
          cmake --build build/win
      - name: d1-backend.exe
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER: /opt/llvm-mingw/bin/x86_64-w64-mingw32-clang
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-gnullvm --manifest-path backend/Cargo.toml
      - name: Package
        run: |
          mkdir -p dist
          cp build/win/d1-native.exe backend/target/x86_64-pc-windows-gnullvm/release/d1-backend.exe dist/
          sha256sum dist/*.exe | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: destiny-native-windows
          path: dist
          retention-days: 30
